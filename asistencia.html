<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista · REIVAJ</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B1B3C">
<meta name="color-scheme" content="only light">
<link rel="icon" href="assets/icono-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lista REIVAJ">
<style>
  :root { --marino:#0B1B3C; --dorado:#EAB02A; --papel:#F6F4EF; --linea:#E2DED4; --texto:#13213F; --suave:#5B6478; --ok:#1E7B4F; --mal:#C0262D; color-scheme: only light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--papel); color:var(--texto); font:16px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  header { background:var(--marino); color:#fff; padding:calc(12px + env(safe-area-inset-top)) 16px 12px; position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  header h1 { margin:0; font-size:18px; font-style:italic; font-weight:800; letter-spacing:.02em; }
  header small { color:#C7CDDA; font-size:12px; display:block; }
  header button { background:none; border:1px solid rgba(255,255,255,.3); color:#fff; border-radius:8px; padding:6px 10px; font:inherit; font-size:13px; }
  main { padding:14px 16px 130px; max-width:560px; margin:0 auto; }
  .tarjeta { background:#fff; border:1px solid var(--linea); border-radius:14px; padding:14px; margin-bottom:12px; }
  label { display:block; font-weight:600; font-size:14px; margin:0 0 6px; }
  input[type=date], input[type=text], input[type=search], textarea { width:100%; font:inherit; padding:12px; border:1px solid var(--linea); border-radius:10px; background:#fff; color:var(--texto); }
  textarea { min-height:70px; resize:vertical; }
  input[type=search] { -webkit-appearance:none; appearance:none; }
  .horas { display:grid; grid-template-columns:repeat(auto-fit, minmax(96px, 1fr)); gap:8px; }
  .hora { border:2px solid var(--linea); background:#fff; border-radius:12px; padding:12px 8px; text-align:center; font-weight:700; font-size:18px; color:var(--texto); font-family:inherit; }
  .hora small { display:block; font-weight:500; font-size:12px; color:var(--suave); }
  .hora.activa { border-color:var(--marino); background:var(--marino); color:#fff; }
  .hora.activa small { color:#C7CDDA; }
  .hora.hecha::after { content:"✓ pasada"; display:block; font-size:11px; color:var(--ok); font-weight:600; }
  .hora.activa.hecha::after { color:var(--dorado); }
  .alumno { display:flex; align-items:center; gap:12px; padding:12px 10px; border-bottom:1px solid var(--linea); cursor:pointer; user-select:none; -webkit-user-select:none; }
  .alumno:last-child { border-bottom:0; }
  .casilla { width:34px; height:34px; border-radius:9px; border:2px solid #B9B3A6; flex:none; display:grid; place-items:center; font-weight:900; color:#fff; font-size:20px; }
  .alumno.vino .casilla { background:var(--ok); border-color:var(--ok); }
  .alumno .nombre { flex:1; font-size:16px; }
  .alumno .dias { font-size:12px; color:var(--suave); letter-spacing:.08em; }
  .nota-btn { border:0; background:none; font-size:20px; padding:4px 6px; color:var(--suave); }
  .nota-alumno { margin:-4px 0 8px 46px; }
  .fijo { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--linea); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); z-index:6; }
  .fijo .fila { display:flex; gap:10px; align-items:center; max-width:560px; margin:0 auto; }
  button.principal { flex:1; background:var(--dorado); color:var(--marino); border:0; border-radius:12px; padding:15px; font-weight:800; font-size:17px; font-family:inherit; }
  button.principal:disabled { opacity:.5; }
  button.sec { background:#fff; border:1px solid var(--linea); border-radius:10px; padding:10px 12px; font:inherit; font-weight:600; color:var(--texto); }
  .cuenta { font-weight:700; white-space:nowrap; }
  .aviso { padding:12px; border-radius:10px; background:#FFF6DC; border:1px solid #F0D58A; margin-bottom:12px; }
  .error { background:#FDECEC; border-color:#F2B8B8; color:var(--mal); }
  .ok { background:#E7F4EC; border-color:#B7DEC6; color:var(--ok); }
  .oculto { display:none !important; }
  .buscar { margin-bottom:8px; }
  .prueba { display:grid; gap:8px; margin-bottom:10px; }
  .agendadas { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .agendadas button { border:1.5px dashed var(--dorado); background:#FFFBEF; border-radius:10px; padding:8px 10px; font:inherit; font-size:14px; color:var(--texto); }
  .agendadas button.puesta { border-style:solid; background:var(--dorado); }
  h2 { font-size:15px; margin:0 0 10px; text-transform:uppercase; letter-spacing:.08em; color:var(--suave); }
  .pendientes { font-size:13px; }
  .alumno .nombre small { display:block; font-size:12px; color:#8A5A00; margin-top:2px; }
  .alumno.fuera { cursor:default; }
  h3.sep { font-size:13px; margin:16px 0 2px; text-transform:uppercase; letter-spacing:.08em; color:var(--suave); }
  .otro { display:flex; align-items:center; gap:12px; padding:10px; border-bottom:1px solid var(--linea); }
  .otro:last-child { border-bottom:0; }
  .otro .nombre { flex:1; font-size:16px; }
  .otro .nombre small { display:block; font-size:12px; color:var(--suave); margin-top:2px; }
  button.agregar { border:1.5px solid var(--ok); background:#fff; color:var(--ok); border-radius:10px; padding:9px 12px; font:inherit; font-weight:700; font-size:14px; white-space:nowrap; }
  .quitar { border:0; background:none; font-size:18px; color:var(--mal); padding:4px 6px; }
  .nadie { font-size:14px; color:var(--suave); padding:8px 10px; }
</style>
</head>
<body>
<header>
  <div><h1 id="titulo">Lista de asistencia</h1><small id="subtitulo">Una hora, un envío.</small></div>
  <button type="button" id="actualizar" class="oculto">Actualizar</button>
</header>
<main>
  <section id="vista-sin-llave" class="tarjeta oculto">
    <p><b>Esta lista se abre con el link que da el programa del gimnasio.</b></p>
    <p>En el programa: Configuración → Conexión con la página → «Link de tu lista». Ábrelo en este celular una vez y queda guardado.</p>
  </section>

  <div id="mensaje" class="aviso oculto"></div>
  <div id="pendientes" class="aviso pendientes oculto"></div>

  <section id="vista-lista" class="oculto">
    <div class="tarjeta">
      <label for="fecha">Fecha de la clase</label>
      <input id="fecha" type="date">
      <div style="height:12px"></div>
      <label>¿Qué hora estás pasando?</label>
      <div class="horas" id="horas"></div>
    </div>
    <div class="tarjeta oculto" id="bloque-alumnos">
      <h2 id="titulo-hora">Palomea a quien esté</h2>
      <input class="buscar" id="buscar" type="search" placeholder="Buscar, también de otra hora" autocomplete="off">
      <div id="alumnos"></div>
      <div id="otros"></div>
      <div id="fuera"></div>
    </div>
    <div class="tarjeta oculto" id="bloque-extra">
      <h2>¿Vino alguien a probar?</h2>
      <div class="agendadas" id="agendadas"></div>
      <div id="pruebas"></div>
      <button class="sec" id="mas-prueba" type="button">+ Anotar otra clase de prueba</button>
      <div style="height:14px"></div>
      <label for="nota-dia">¿Pasó algo? (opcional)</label>
      <textarea id="nota-dia" placeholder="Ej. Se fue temprano, le dolía la rodilla."></textarea>
    </div>
  </section>
</main>
<div class="fijo oculto" id="barra">
  <div class="fila"><span class="cuenta" id="cuenta">0 aquí</span><button class="principal" id="enviar">Enviar esta hora</button></div>
</div>

<script src="config.js"></script>
<script src="buzon.js"></script>
<script src="asistencia.js"></script>
</body>
</html>
